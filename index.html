<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCR Food Products Trading — Fleet Operations & Driver Portal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gcr: {
              DEFAULT: '#4AADE3',
              dark: '#2A93CC',
              light: '#EBF6FC',
              navy: '#0B131B',
              surface: '#131F2C',
              card: '#192838',
              border: '#24374E'
            }
          }
        }
      }
    }
  </script>

  <style>
    #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
    .leaflet-popup-content-wrapper {
      background: #192838 !important;
      color: #f1f5f9 !important;
      border: 1px solid #24374E;
      border-radius: 0.75rem;
    }
    .leaflet-popup-tip { background: #192838 !important; }
  </style>
</head>
<body class="bg-gcr-navy text-slate-100 min-h-screen flex flex-col font-sans selection:bg-gcr selection:text-white">

  <!-- Header & Mode Switcher -->
  <header class="border-b border-gcr-border bg-gcr-surface/90 backdrop-blur-md px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3.5">
      <div class="h-10 w-10 rounded-xl bg-gcr flex flex-col items-center justify-center font-black text-white shadow-lg shadow-gcr/25">
        <span class="text-xs leading-none font-black">GCR</span>
        <span class="text-[7px] font-semibold tracking-tighter opacity-90">COLD</span>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg tracking-tight text-white">GCR Food Products Trading</h1>
        <p class="text-xs text-gcr font-medium">Navotas Central Logistics Hub</p>
      </div>
    </div>

    <!-- Mode Tabs: Dispatch Admin vs Driver View -->
    <div class="flex items-center bg-gcr-card p-1 rounded-xl border border-gcr-border">
      <button id="tab-admin" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-gcr text-white shadow-sm transition">
        Admin Dispatch
      </button>
      <button id="tab-driver" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
        Driver Mode
      </button>
    </div>
  </header>

  <!-- VIEW 1: ADMIN DISPATCH PORTAL -->
  <main id="view-admin" class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 md:p-6 overflow-hidden">
    <!-- Left Sidebar: Fleet List & ETAs -->
    <section class="space-y-4 flex flex-col h-full">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Multi-Drop Route Monitoring</h2>
        <span id="truck-count" class="text-xs bg-gcr-card border border-gcr-border px-2.5 py-0.5 rounded-full text-gcr font-semibold">3 Active</span>
      </div>

      <div id="fleet-list" class="space-y-3.5 flex-1 overflow-y-auto pr-1">
        <!-- Generated dynamically in app.js -->
      </div>
    </section>

    <!-- Map Viewport -->
    <section class="lg:col-span-2 bg-gcr-surface border border-gcr-border p-2.5 rounded-2xl flex flex-col min-h-[460px] shadow-2xl relative">
      <div id="map"></div>
    </section>
  </main>

  <!-- VIEW 2: TRUCK OPERATOR / DRIVER PORTAL -->
  <main id="view-driver" class="hidden flex-1 max-w-xl w-full mx-auto p-4 md:p-6 space-y-5">
    <div class="bg-gcr-surface border border-gcr-border rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-white">Driver Navigation Portal</h2>
          <p class="text-xs text-slate-400">Share your live GPS with Navotas Dispatch</p>
        </div>
        <span id="gps-status-badge" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 border border-slate-700">
          GPS Offline
        </span>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Your Assigned Vehicle</label>
        <select id="driver-truck-select" class="w-full bg-gcr-card border border-gcr-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gcr">
          <option value="REEFER-01">REEFER-01 (Plate: NDG-4421) — Danilo B.</option>
          <option value="REEFER-02">REEFER-02 (Plate: CBC-8902) — Reynaldo S.</option>
          <option value="REEFER-03">REEFER-03 (Plate: TGC-1198) — Arnel M.</option>
        </select>
      </div>

      <button id="btn-toggle-gps" class="w-full py-3 rounded-xl font-bold text-sm bg-gcr hover:bg-gcr-dark text-white shadow-lg shadow-gcr/20 transition flex items-center justify-center gap-2">
        <span>📡</span> Start Sharing Live GPS
      </button>

      <div id="driver-telemetry" class="hidden text-xs bg-gcr-card/60 p-3 rounded-xl border border-gcr-border space-y-1 text-slate-300">
        <p>Current Coordinates: <span id="telemetry-coords" class="font-mono text-gcr">Detecting...</span></p>
        <p>Current Speed: <span id="telemetry-speed" class="font-mono text-emerald-400">0 km/h</span></p>
      </div>
    </div>

    <!-- Multi-Drop Order Checklist -->
    <div class="bg-gcr-surface border border-gcr-border rounded-2xl p-6 shadow-xl space-y-4">
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300">Today's Delivery Stops</h3>
      <div id="driver-stops-list" class="space-y-3">
        <!-- Injected via app.js -->
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
