<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCR Food Products Trading — Cold Chain Fleet Operations</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gcr: {
              DEFAULT: '#4AADE3',
              dark: '#2A93CC',
              light: '#EBF6FC',
              navy: '#0B131B',
              surface: '#131F2C',
              card: '#192838',
              border: '#24374E'
            }
          }
        }
      }
    }
  </script>

  <style>
    #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
    .leaflet-popup-content-wrapper {
      background: #192838 !important;
      color: #f1f5f9 !important;
      border: 1px solid #24374E;
      border-radius: 0.75rem;
    }
    .leaflet-popup-tip {
      background: #192838 !important;
    }
  </style>
</head>
<body class="bg-gcr-navy text-slate-100 min-h-screen flex flex-col font-sans selection:bg-gcr selection:text-white">

  <!-- Header -->
  <header class="border-b border-gcr-border bg-gcr-surface/90 backdrop-blur-md px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3.5">
      <div class="h-11 w-11 rounded-xl bg-gcr flex flex-col items-center justify-center font-black text-white shadow-lg shadow-gcr/25">
        <span class="text-xs leading-none font-black">GCR</span>
        <span class="text-[8px] font-semibold tracking-tighter opacity-90">COLD</span>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg tracking-tight text-white">GCR Food Products Trading</h1>
        <p class="text-xs text-gcr font-medium">Navotas Hub Cold Chain Fleet Dispatch</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Cold Chain Active
      </span>
    </div>
  </header>

  <!-- Dashboard Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 md:p-6 overflow-hidden">
    
    <!-- Sidebar / Fleet Cards -->
    <section class="space-y-4 flex flex-col h-full">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Reefer Trucks Status</h2>
        <span id="truck-count" class="text-xs bg-gcr-card border border-gcr-border px-2.5 py-0.5 rounded-full text-gcr font-semibold">3 Units</span>
      </div>

      <div id="fleet-list" class="space-y-3 flex-1 overflow-y-auto pr-1">
        <!-- Injected via app.js -->
      </div>
    </section>

    <!-- Map Viewport -->
    <section class="lg:col-span-2 bg-gcr-surface border border-gcr-border p-2.5 rounded-2xl flex flex-col min-h-[460px] shadow-2xl relative">
      <div id="map"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
